<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass compatibility finder</title>
<style>
  :root{--bg:#f2efe8;--card:#fff;--line:#e3dfd4;--ink:#1f1f1c;--mut:#6f6d64;--green:#e6efe2;--green-ink:#46694a;--btn:#6b8f63;--terra:#c26f4e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;margin:0 auto;padding:18px 20px 60px}
  .hero{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 24px 28px;overflow:hidden}
  .hero::before{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:var(--green)}
  .tag{position:relative;display:inline-block;background:var(--green);color:var(--green-ink);font-size:13px;font-weight:800;letter-spacing:.12em;padding:8px 16px;border-radius:999px}
  .hero h1{position:relative;margin:18px 0 12px;font-size:44px;line-height:1.02;font-weight:800;letter-spacing:-.02em}
  .hero p{position:relative;margin:0;color:var(--mut);font-size:19px;line-height:1.4}
  .label{margin:30px 4px 10px;font-weight:700;font-size:17px}
  .search{background:#fff;border:1.5px solid var(--line);border-radius:999px;display:flex;align-items:center;padding:0 22px;height:58px}
  .search input{flex:1;border:0;outline:none;background:transparent;font:inherit;font-size:18px;color:var(--ink)}
  .search input::placeholder{color:#b1ab9b}
  .search:focus-within{border-color:var(--btn);box-shadow:0 0 0 4px rgba(107,143,99,.15)}
  .help{margin:12px 6px 0;color:var(--mut);font-size:14px;line-height:1.45}
  .sep{height:1px;background:var(--line);margin:30px 0 26px}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .head h2{margin:0;font-size:21px;font-weight:800}
  .group{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px;margin-bottom:16px}
  .badge{display:inline-block;background:var(--terra);color:#fff;font-weight:700;font-size:15px;padding:6px 14px;border-radius:999px}
  .models{margin:14px 0 14px;font-size:17px;font-weight:700;line-height:1.55;word-break:break-word}
  mark{background:#f4e6a6;color:inherit;border-radius:4px;padding:0 2px}
  .src{color:var(--mut);font-size:14px;line-height:1.4}
  .none{background:#fff;border:1px dashed #cbc6b6;border-radius:16px;padding:18px;color:var(--mut);font-size:15px}
  .found{border-color:var(--btn);box-shadow:0 0 0 3px rgba(107,143,99,.18)}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <span class="tag">SHOP TOOL</span>
    <h1>Glass compatibility finder</h1>
    <p>Type a phone model — get told exactly which glass to grab.</p>

  <p class="help">Type the exact model code (e.g. A77, Y76 5G) — at least 2 characters. This avoids mixing up similar codes across brands.</p>

  <div id="found"></div>

  <div class="sep"></div>

</div>

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parts = m => m.split("/").map(s => s.trim()).filter(Boolean);
BOXES.forEach(b => b.list = parts(b.models));

// Ignore case, spaces, "+", "-" and the word "NORD", so "ce4" or "1+CE4" matches "1+NORD CE 4"
const norm = s => s.toLowerCase().replace(/nord/g, "").replace(/[^a-z0-9]/g, "");
const matches = (x, nq) => { const n = norm(x); return n === nq || n.endsWith(nq); };

function card(b, term, extra) {
  const shown = term
    ? b.list.map(x => matches(x, term) ? `<mark>${esc(x)}</mark>` : esc(x))
    : b.list.map(esc);
  return `<div class="group ${extra||""}">
    <span class="badge">Stock: ${esc(b.name)}</span>
    <div class="models">${shown.join(", ")}</div>
    <div class="src">From ${esc(b.title)} packaging</div>
  </div>`;
}

const q = document.getElementById("q");
const found = document.getElementById("found");
const all = document.getElementById("all");
document.getElementById("allTitle").textContent = `All compatibility groups (${BOXES.length})`;
all.innerHTML = BOXES.map(b => card(b, "")).join("");

let sampleFn = null;
if (window.claude && window.claude.use) {
  window.claude.use("sample").then(fn => { sampleFn = fn; render(); }).catch(() => {});
}

    "\n\nThe phone model is \"" + raw + "\". Reply in this exact format and nothing else:\nUSE: Box N (one matching model name from the box)\nIf no box is a good fit, reply: USE: none, ask the shop owner.\nIf the phone is not in any box, use the box with the most similar screen size and edge type, and add the word (guess) after the box number.";
  try {
    const r = await sampleFn(prompt, { modelTier: "default" });
    out.innerHTML = '<div class="group found"><div class="models" style="white-space:pre-line;font-size:22px">' + esc(r.text) + '</div></div>';
  } catch (e) {
    out.innerHTML = '<div class="none">AI is not available right now. Check the glass against the phone manually.</div>';
  }
}

function render() {
  const raw = q.value.trim();
  const term = norm(raw);
  if (term.length < 2) { found.innerHTML = ""; return; }
  const hits = BOXES.filter(b => b.list.some(x => matches(x, term)));
  if (!hits.length) {
    if (!sampleFn) {
      found.innerHTML = `<div class="none">No glass found for "${esc(raw)}". Check the model code and try again.</div>`;
      return;
    }
    found.innerHTML = `<div class="none">No glass found for "${esc(raw)}".</div>
      <button id="ask" style="padding:12px 18px;font-size:16px;border-radius:8px;border:0;background:#ffd400;cursor:pointer">Ask AI which glass fits ${esc(raw)}</button>
      <div id="aiAns"></div>`;
    document.getElementById("ask").onclick = askAI;
    return;
  }
  found.innerHTML = hits.map(b => card(b, term, "found")).join("");
}
q.addEventListener("input", render);
</script>
</body>
</html>
